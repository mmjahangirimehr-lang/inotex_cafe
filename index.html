<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INOTEX CAFE Menu</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Vazirmatn', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0c0e14;
      color: #f3f4f6;
    }
    .glass-header {
      background: rgba(12, 14, 20, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .active-tab {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0c0e14;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
    }
    .inactive-tab {
      background: rgba(255, 255, 255, 0.04);
      color: #9ca3af;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .card-gradient {
      background: linear-gradient(180deg, rgba(26, 30, 42, 0.75) 0%, rgba(18, 21, 31, 0.9) 100%);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .card-gradient:hover {
      border-color: rgba(245, 158, 11, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="min-h-screen pb-16 antialiased selection:bg-amber-500 selection:text-black">

  <!-- Header Section with Logo -->
  <header class="sticky top-0 z-50 glass-header border-b border-white/10 px-4 py-3 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img 
          src="https://ibb.co/sdsnJB5g" 
          alt="INOTEX CAFE Logo" 
          class="h-10 md:h-12 w-auto object-contain"
          onerror="this.style.display='none'; document.getElementById('alt-logo').classList.remove('hidden');"
        />
        <div id="alt-logo" class="hidden text-xl font-extrabold tracking-wider text-amber-400">
          INOTEX <span class="text-white font-light text-sm">CAFÉ</span>
        </div>
      </div>
      <span class="text-xs text-amber-400/90 font-medium px-2.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/20">
        منوی دیجیتال
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 mt-5">

    <!-- Categories Navigation (Static Grid Layout) -->
    <nav class="mb-6">
      <div id="category-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2">
        <!-- Category Buttons Rendered via JS -->
      </div>
    </nav>

    <!-- Menu Items Grid -->
    <div id="menu-items-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Cards Rendered via JS -->
    </div>

  </main>

  <script>
    // Data Definition
    const menuData = [
      // 1. قهوه (صفحه پیش‌فرض شروع)
      {
        category: "قهوه",
        items: [
          { name: "اسپرسو سینگل", desc: "۱۰۰٪ عربیکا تخصصی", price: "۵۵,۰۰۰", img: "https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=500&auto=format&fit=crop&q=60" },
          { name: "اسپرسو دبل", desc: "دبل شات عربیکا با بادی غنی", price: "۶۵,۰۰۰", img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&auto=format&fit=crop&q=60" },
          { name: "آمریکانو", desc: "ترکیب اسپرسو دبل و آب جوش", price: "۷۰,۰۰۰", img: "https://images.unsplash.com/photo-1551030173-122aabc4489c?w=500&auto=format&fit=crop&q=60" },
          { name: "لاته", desc: "اسپرسو، شیر بخار داده شده و فوم مخملی", price: "۸۵,۰۰۰", img: "https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?w=500&auto=format&fit=crop&q=60" },
          { name: "کاپوچینو", desc: "اسپرسو با فوم شیر غلیظ و پودر کاکائو", price: "۸۵,۰۰۰", img: "https://images.unsplash.com/photo-1534778101976-62847782c213?w=500&auto=format&fit=crop&q=60" },
          { name: "کارامل ماکیاتو", desc: "ترکیب شیر، وانیل، اسپرسو و سس کارامل", price: "۹۵,۰۰۰", img: "https://images.unsplash.com/photo-1485808191679-5f86510681a2?w=500&auto=format&fit=crop&q=60" }
        ]
      },
      // 2. تیرامیسو
      {
        category: "تیرامیسو",
        items: [
          { name: "تیرامیسو کلاسیک قهوه", desc: "لیدی فینگر، کرم ماسکارپونه، اسپرسو تازه", price: "۱۴۵,۰۰۰", img: "https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=500&auto=format&fit=crop&q=60" },
          { name: "تیرامیسو شکلات", desc: "کرم ماسکارپونه شکلاتی و گاناش بلژیکی", price: "۱۵۵,۰۰۰", img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=500&auto=format&fit=crop&q=60" },
          { name: "تیرامیسو توت فرنگی", desc: "طعم میوه‌ای و سبک با پوره توت‌فرنگی تازه", price: "۱۶۰,۰۰۰", img: "https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=500&auto=format&fit=crop&q=60" }
        ]
      },
      // 3. چای و دمنوش
      {
        category: "چای و دمنوش",
        items: [
          { name: "چای کلاسیک", desc: "همراه با ساید انتخابی", price: "۶۰,۰۰۰", img: "https://ibb.co/wrbXx0FY" },
          { name: "چای مراکشی", desc: "همراه با ساید انتخابی", price: "۷۵,۰۰۰", img: "https://ibb.co/wrbXx0FY" },
          { name: "دمنوش کندلوس", desc: "آرامش‌بخش و نشاط‌آور به همراه ساید", price: "۸۰,۰۰۰", img: "https://ibb.co/FLSjJbKg" },
          { name: "دمنوش به و دارچین", desc: "عطر اصیل به و چوب دارچین طبیعی + ساید", price: "۸۰,۰۰۰", img: "https://ibb.co/1GMF4754" },
          { name: "دمنوش سیب و دارچین", desc: "ترکیب دلنشین سیب خشک و دارچین + ساید", price: "۸۰,۰۰۰", img: "https://ibb.co/5xkYY8v0" },
          { name: "دمنوش گل گاو زبان", desc: "سنتی، آرام‌بخش و تسکین‌دهنده + ساید", price: "۸۰,۰۰۰", img: "https://ibb.co/6RvcvV8n" }
        ]
      },
      // 4. ساید
      {
        category: "ساید",
        items: [
          { name: "باقلوا گردو", desc: "باقلوای تازه و سنتی گردویی", price: "همراه با چای و دمنوش", img: "https://ibb.co/WWnGkhJp" },
          { name: "باقلوا پسته", desc: "مغز پسته اعلا با شربت زعفران", price: "همراه با چای و دمنوش", img: "https://ibb.co/PvhhQ7Pb" },
          { name: "باقلوا بادام", desc: "ترد و معطر با خلال بادام تازه", price: "همراه با چای و دمنوش", img: "https://ibb.co/Bdyx4BB" },
          { name: "کوکی دبل چاکلت", desc: "کوکی شکلاتی غنی با تکه‌های شکلات تلخ", price: "همراه با چای و دمنوش", img: "https://ibb.co/zpvC2f7" },
          { name: "کوکی گردو شکلات", desc: "ترکیب گردوی تازه و چیپس شکلات", price: "همراه با چای و دمنوش", img: "https://ibb.co/fYtxXhZ3" },
          { name: "کوکی رژیمی جو", desc: "سالم و کم‌کالری تهیه شده از جو دوسر", price: "همراه با چای و دمنوش", img: "https://ibb.co/hJK00Lh7" }
        ]
      },
      // 5. نوشیدنی سرد
      {
        category: "نوشیدنی سرد",
        items: [
          { name: "فیزیو", desc: "طعم‌ها: کولا موهیتو، کولا لیمو", price: "۹۰,۰۰۰", img: "https://ibb.co/jZ1ctdWK" },
          { name: "آیس آمریکانو", desc: "اسپرسو دوبل، یخ، آب تصفیه شده", price: "۷۵,۰۰۰", img: "https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=500&auto=format&fit=crop&q=60" },
          { name: "آیس لاته", desc: "شیر سرد، یخ و اسپرسو تازه", price: "۹۰,۰۰۰", img: "https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=500&auto=format&fit=crop&q=60" }
        ]
      }
    ];

    // State: Default start tab set to 'قهوه'
    let activeCategory = "قهوه";

    function renderCategories() {
      const container = document.getElementById("category-container");
      container.innerHTML = menuData.map(cat => {
        const isActive = cat.category === activeCategory;
        const cls = isActive ? "active-tab" : "inactive-tab hover:bg-white/10";
        return `
          <button 
            onclick="setCategory('${cat.category}')" 
            class="py-2.5 px-3 rounded-xl text-xs sm:text-sm transition-all duration-200 text-center ${cls}">
            ${cat.category}
          </button>
        `;
      }).join("");
    }

    function renderItems() {
      const container = document.getElementById("menu-items-container");
      const current = menuData.find(c => c.category === activeCategory);
      if (!current) return;

      container.innerHTML = current.items.map(item => `
        <div class="card-gradient rounded-2xl p-3.5 flex gap-3.5 items-center transition-all duration-300">
          <div class="w-24 h-24 rounded-xl overflow-hidden bg-white/5 flex-shrink-0 relative">
            <img 
              src="${item.img}" 
              alt="${item.name}" 
              class="w-full h-full object-cover" 
              onerror="this.src='https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=500&auto=format&fit=crop&q=60'"
            />
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-base font-bold text-gray-100 truncate mb-1">${item.name}</h3>
            <p class="text-xs text-gray-400 line-clamp-2 leading-relaxed mb-2">${item.desc}</p>
            <div class="flex items-center justify-between">
              <span class="text-xs sm:text-sm font-extrabold ${item.price.includes('تومان') || !isNaN(item.price.replace(/,/g, '')) ? 'text-amber-400' : 'text-emerald-400'}">
                ${item.price} ${item.price.includes('همراه') ? '' : '<span class="text-[10px] font-normal text-gray-400">تومان</span>'}
              </span>
            </div>
          </div>
        </div>
      `).join("");
    }

    function setCategory(catName) {
      activeCategory = catName;
      renderCategories();
      renderItems();
    }

    // Initial Execution
    renderCategories();
    renderItems();
  </script>
</body>
</html>
